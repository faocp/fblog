baseURL = 'https://fffelipe.com/'
languageCode = 'en-us'
title = "fffelipe's world wide web"
# Keep auto-generated titles (category terms, taxonomy lists) lowercase, like the rest of the site.
titleCaseStyle = "none"

[params]
  author      = "fffelipe"
  description = "what's on my mind lately?"
  currently   = [
    "reading: code by charles petzold",
    "tinkering: <a href=\"https://artstamps.fffelipe.com/\">artstamps</a>, this blog, a camera",
    "thinking about: no thoughts, just vibes",
  ]

# Only categories: listing them here turns off Hugo's default (unused) tags taxonomy.
[taxonomies]
  category = "categories"

[[menus.main]]
  name   = "notes"
  url    = "/posts/"
  weight = 1

[[menus.main]]
  name   = "links"
  url    = "/links/"
  weight = 3

[[menus.main]]
  name   = "about"
  url    = "/about/"
  weight = 4

[markup.goldmark.renderer]
  # Content is authored locally/trusted; this permits intentional inline HTML in Markdown.
  unsafe = true

[markup.highlight]
  style     = "monokai"
  noClasses = true
