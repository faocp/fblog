{{/* One row of a post list: title [tags] ···· date, all on one line.
     Call with (dict "page" . "cats" true). */}}
{{ $p := .page }}
<li class="post-row">
  <a class="post-row-title" href="{{ $p.RelPermalink }}">{{ $p.Title }}</a>
  <span class="tags">
    {{ if .cats }}{{ range $p.Params.categories }}<a class="cat" href="{{ printf "categories/%s/" (. | urlize) | relURL }}">{{ . }}</a>{{ end }}{{ end }}
  </span>
  <span class="post-row-leader" aria-hidden="true"></span>
  <time class="post-date" datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006-01-02" }}</time>
</li>
