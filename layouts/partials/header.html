<header>
  {{ $path := strings.TrimSuffix "/" .RelPermalink }}
  <nav class="site-nav" aria-label="main navigation">
    <span class="site-nav-prompt" aria-hidden="true">fffelipe@www:<span class="site-nav-path">~{{ $path }}</span>$</span>
    <a href="{{ "/" | relURL }}" aria-label="home"{{ if .IsHome }} aria-current="page"{{ end }}>~</a>
    {{ range site.Menus.main }}
    <a href="{{ .URL | relURL }}"{{ if hasPrefix $.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button id="theme-toggle" type="button" aria-label="toggle theme" title="toggle theme"></button>
  </nav>
</header>
<script>
  (function() {
    // theme toggle
    var btn = document.getElementById('theme-toggle');
    var moonSVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    var sunSVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
    function updateToggle() {
      if (!btn) return;
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = dark ? sunSVG : moonSVG;
      btn.setAttribute('aria-label', dark ? 'current theme: dark. switch to light' : 'current theme: light. switch to dark');
      btn.setAttribute('title', dark ? 'switch to light theme' : 'switch to dark theme');
    }
    updateToggle();
    if (btn) btn.addEventListener('click', function() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
      updateToggle();
    });
  })();
</script>
